name: Build QMK firmware

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build-halcyon:
    name: 'Build all Swift firmware outputs'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout userspace
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t qmk-builder -f Dockerfile.qmk .

      - name: Build left half (Cirque trackpad)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/qmk_userspace" \
            -e QMK_USERSPACE=/qmk_userspace \
            -e SKIP_GIT=1 \
            -e SKIP_VERSION=1 \
            qmk-builder \
            sh -c 'qmk config user.overlay_dir=/qmk_userspace && qmk compile -kb splitkb/halcyon/kyria/rev4 -km obbut -e HLC_CIRQUE_TRACKPAD=1 -e TARGET=kyria_rev4_obbut_left_cirque'

      - name: Build right half (Encoder)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/qmk_userspace" \
            -e QMK_USERSPACE=/qmk_userspace \
            -e SKIP_GIT=1 \
            -e SKIP_VERSION=1 \
            qmk-builder \
            sh -c 'qmk config user.overlay_dir=/qmk_userspace && qmk compile -kb splitkb/halcyon/kyria/rev4 -km obbut -e HLC_ENCODER=1 -e TARGET=kyria_rev4_obbut_right_encoder'

      - name: Build Elora left half
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/qmk_userspace" \
            -e QMK_USERSPACE=/qmk_userspace \
            -e SKIP_GIT=1 \
            -e SKIP_VERSION=1 \
            qmk-builder \
            sh -c 'qmk config user.overlay_dir=/qmk_userspace && qmk compile -kb splitkb/halcyon/elora/rev2 -km obbut -e HLC_NONE=1 -e TARGET=elora_rev2_obbut_left'

      - name: Build Elora right half
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/qmk_userspace" \
            -e QMK_USERSPACE=/qmk_userspace \
            -e SKIP_GIT=1 \
            -e SKIP_VERSION=1 \
            qmk-builder \
            sh -c 'qmk config user.overlay_dir=/qmk_userspace && qmk compile -kb splitkb/halcyon/elora/rev2 -km obbut -e HLC_ENCODER=1 -e TARGET=elora_rev2_obbut_right_encoder'

      - name: Upload Kyria firmware
        uses: actions/upload-artifact@v4
        with:
          name: halcyon-firmware
          path: |
            kyria_rev4_obbut_left_cirque.uf2
            kyria_rev4_obbut_right_encoder.uf2
            elora_rev2_obbut_left.uf2
            elora_rev2_obbut_right_encoder.uf2
          retention-days: 1

  build-q15:
    name: 'Build Q15 Max'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout userspace
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t qmk-keychron-builder -f Dockerfile.keychron .

      - name: Build Q15 Max firmware
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/qmk_userspace" \
            -e QMK_USERSPACE=/qmk_userspace \
            qmk-keychron-builder \
            sh -c 'cd /qmk_firmware && make keychron/q15_max/ansi_encoder:obbut'

      - name: Upload Q15 Max firmware
        uses: actions/upload-artifact@v4
        with:
          name: q15-max-firmware
          path: keychron_q15_max_ansi_encoder_obbut.bin
          retention-days: 1

  build-planck:
    name: 'Build Planck EZ Glow'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout userspace
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t qmk-zsa-builder -f Dockerfile.zsa .

      - name: Build Planck EZ Glow firmware
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/qmk_userspace" \
            -e QMK_USERSPACE=/qmk_userspace \
            qmk-zsa-builder \
            sh -c 'cd /qmk_firmware && make zsa/planck_ez/glow:obbut'

      - name: Upload Planck EZ Glow firmware
        uses: actions/upload-artifact@v4
        with:
          name: planck-firmware
          path: zsa_planck_ez_glow_obbut.bin
          retention-days: 1

  publish:
    name: 'Publish Release'
    runs-on: ubuntu-latest
    needs: [build-halcyon, build-q15, build-planck]

    steps:
      - name: Download Halcyon firmware
        uses: actions/download-artifact@v4
        with:
          name: halcyon-firmware

      - name: Download Q15 Max firmware
        uses: actions/download-artifact@v4
        with:
          name: q15-max-firmware

      - name: Download Planck EZ Glow firmware
        uses: actions/download-artifact@v4
        with:
          name: planck-firmware

      - name: Delete existing release
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Create release
        run: |
          gh release create latest \
            --title "Latest Firmware" \
            --notes "Automatically built firmware binaries.

          **Kyria Rev4 (Halcyon)**
          - \`kyria_rev4_obbut_left_cirque.uf2\` - Left half with Cirque trackpad
          - \`kyria_rev4_obbut_right_encoder.uf2\` - Right half with encoder

          **Elora Rev2 (Halcyon)**
          - \`elora_rev2_obbut_left.uf2\` - Left half
          - \`elora_rev2_obbut_right_encoder.uf2\` - Right half with encoder

          **Keychron Q15 Max**
          - \`keychron_q15_max_ansi_encoder_obbut.bin\` - ANSI encoder variant

          **ZSA Planck EZ Glow**
          - \`zsa_planck_ez_glow_obbut.bin\` - Planck EZ Glow

          Built from commit ${{ github.sha }}" \
            kyria_rev4_obbut_left_cirque.uf2 \
            kyria_rev4_obbut_right_encoder.uf2 \
            elora_rev2_obbut_left.uf2 \
            elora_rev2_obbut_right_encoder.uf2 \
            keychron_q15_max_ansi_encoder_obbut.bin \
            zsa_planck_ez_glow_obbut.bin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
