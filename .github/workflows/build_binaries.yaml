name: Build QMK firmware

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build-halcyon:
    name: 'Build all Swift firmware outputs'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout userspace
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t qmk-userspace-swift-builder -f Dockerfile.qmk .

      - name: Build and emulate both Kyria halves
        shell: bash
        run: |
          mkdir -p .emulator-cache
          set +e
          ./docker-build.sh test-kyria-emulator 2>&1 | tee /tmp/kyria-emulator.log
          status=${PIPESTATUS[0]}
          grep -E '^(left|right) (UF2|SHA):|^\{"status":' /tmp/kyria-emulator.log \
            > .emulator-cache/kyria-trace.jsonl || true
          exit "$status"

      - name: Upload sanitized Kyria emulator trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kyria-emulator-failure-trace
          path: .emulator-cache/kyria-trace.jsonl
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and emulate both Elora halves
        shell: bash
        run: |
          mkdir -p .emulator-cache
          set +e
          ./docker-build.sh test-elora-emulator 2>&1 | tee /tmp/elora-emulator.log
          status=${PIPESTATUS[0]}
          grep -E '^(left|right) (UF2|SHA):|^\{"status":' /tmp/elora-emulator.log \
            > .emulator-cache/elora-trace.jsonl || true
          exit "$status"

      - name: Upload sanitized Elora emulator trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: elora-emulator-failure-trace
          path: .emulator-cache/elora-trace.jsonl
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Halcyon firmware
        uses: actions/upload-artifact@v4
        with:
          name: halcyon-firmware
          path: |
            kyria_rev4_obbut_left_cirque.uf2
            kyria_rev4_obbut_right_encoder.uf2
            elora_rev2_obbut_left.uf2
            elora_rev2_obbut_right_encoder.uf2
          retention-days: 1

  build-q15:
    name: 'Build Q15 Max'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout userspace
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t qmk-keychron-builder -f Dockerfile.keychron .

      - name: Build and emulate Q15 Max firmware
        run: ./docker-build.sh test-q15-emulator

      - name: Upload Q15 Max firmware
        uses: actions/upload-artifact@v4
        with:
          name: q15-max-firmware
          path: keychron_q15_max_ansi_encoder_obbut.bin
          retention-days: 1

  build-planck:
    name: 'Build Planck EZ Glow'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout userspace
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t qmk-zsa-builder -f Dockerfile.zsa .

      - name: Build and emulate Planck EZ Glow firmware
        run: ./docker-build.sh test-planck-emulator

      - name: Upload Planck EZ Glow firmware
        uses: actions/upload-artifact@v4
        with:
          name: planck-firmware
          path: zsa_planck_ez_glow_obbut.bin
          retention-days: 1

  publish:
    name: 'Publish Release'
    runs-on: ubuntu-latest
    needs: [build-halcyon, build-q15, build-planck]

    steps:
      - name: Download Halcyon firmware
        uses: actions/download-artifact@v4
        with:
          name: halcyon-firmware

      - name: Download Q15 Max firmware
        uses: actions/download-artifact@v4
        with:
          name: q15-max-firmware

      - name: Download Planck EZ Glow firmware
        uses: actions/download-artifact@v4
        with:
          name: planck-firmware

      - name: Delete existing release
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Create release
        run: |
          gh release create latest \
            --title "Latest Firmware" \
            --notes "Automatically built firmware binaries.

          **Kyria Rev4 (Halcyon)**
          - \`kyria_rev4_obbut_left_cirque.uf2\` - Left half with Cirque trackpad
          - \`kyria_rev4_obbut_right_encoder.uf2\` - Right half with encoder

          **Elora Rev2 (Halcyon)**
          - \`elora_rev2_obbut_left.uf2\` - Left half
          - \`elora_rev2_obbut_right_encoder.uf2\` - Right half with encoder

          **Keychron Q15 Max**
          - \`keychron_q15_max_ansi_encoder_obbut.bin\` - ANSI encoder variant

          **ZSA Planck EZ Glow**
          - \`zsa_planck_ez_glow_obbut.bin\` - Planck EZ Glow

          Built from commit ${{ github.sha }}" \
            kyria_rev4_obbut_left_cirque.uf2 \
            kyria_rev4_obbut_right_encoder.uf2 \
            elora_rev2_obbut_left.uf2 \
            elora_rev2_obbut_right_encoder.uf2 \
            keychron_q15_max_ansi_encoder_obbut.bin \
            zsa_planck_ez_glow_obbut.bin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
