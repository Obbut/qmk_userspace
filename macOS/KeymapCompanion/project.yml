name: KeymapCompanion

options:
  bundleIdPrefix: com.obbut
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    ENABLE_HARDENED_RUNTIME: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  KeymapCompanion:
    type: application
    platform: macOS
    sources:
      - path: KeymapCompanion
    dependencies:
      - sdk: IOKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obbut.KeymapCompanion
        PRODUCT_NAME: KeymapCompanion
        PRODUCT_MODULE_NAME: KeymapCompanion
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Keymap Companion
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        ENABLE_APP_SANDBOX: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  KeymapCompanionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KeymapCompanionTests
    dependencies:
      - target: KeymapCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obbut.KeymapCompanionTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  KeymapCompanion:
    build:
      targets:
        KeymapCompanion: all
        KeymapCompanionTests: [test]
    test:
      targets:
        - KeymapCompanionTests
